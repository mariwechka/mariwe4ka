<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Freelance Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0b0f'/%3E%3Cpath d='M8 24V8l16 16V8' stroke='url(%23g)' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="logo">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="#13151d"/><path d="M8 24V8l16 16V8" stroke="url(#lg)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      NEXUS
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <select id="mode" title="Autonomy"></select>
      <button class="btn estop" id="estop">⏻ EMERGENCY STOP</button>
      <button class="btn ghost sm" id="lang">EN / RU</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn sm menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="title">…</h1>
      <span class="chip"><span class="dot" id="d-worker"></span><span data-t="worker">Agents</span></span>
      <span class="chip"><span class="dot" id="d-ai"></span>AI</span>
      <span class="chip"><span class="dot" id="d-gmail"></span>Gmail</span>
      <span class="chip"><span class="dot" id="d-tg"></span>Telegram</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="shade" id="shade"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>

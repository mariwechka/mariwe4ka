  <header class="site-header" id="siteHeader">
    <div class="site-header__inner">
      <a class="logo" href="#/" aria-label="NOCTURNE — на главную">

        <span class="logo__word">NOCTURNE</span>

        <a href="#/new" data-nav="new">Новинки</a>
        <a href="#/collections" data-nav="collections">Коллекции</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn search-trigger" data-action="open-search" aria-label="Поиск (клавиша /)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <span class="search-trigger__label">Поиск</span>
          <kbd>/</kbd>
        </button>
        <a class="icon-btn" href="#/favorites" aria-label="Избранное">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>

        </button>
        <button class="icon-btn burger" data-action="toggle-menu" aria-label="Меню" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">

      <a href="#/about"><small>04</small>About</a>
      <a href="#/favorites"><small>05</small>Избранное</a>
    </nav>

      <span>Лиговский пр., 74 · ежедневно 12–22</span>
      <span>hello@nocturne.store</span>
    </div>
  </div>

  <main id="main" class="page" tabindex="-1"></main>

  <footer class="site-footer" id="siteFooter"></footer>

  <nav class="tabbar" aria-label="Быстрая навигация">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/></svg><span>Главная</span></a>
    <a href="#/catalog" data-tab="catalog"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span>Каталог</span></a>

    <button data-action="open-cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Корзина</span><i class="badge" data-badge="cart" hidden>0</i></button>

      <h2 class="drawer__title">Корзина <span class="mono" data-cart-count></span></h2>
      <button class="icon-btn" data-action="close-cart" aria-label="Закрыть корзину"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer__body" id="cartDrawerBody"></div>
  </aside>

        <button class="search__close mono" data-action="close-search">Esc ✕</button>
      </div>
      <div class="search__results" id="searchResults" aria-live="polite"></div>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
